name: APK

# Flutter sürümünü (com.tayf.tayf) derler. Depo kökündeki WebView kabuğu
# (android/) ayrıdır, burada kullanılmaz.
# - her itmede derlenir ve "Artifacts" altına yüklenir
# - imza sırları tanımlıysa APK release anahtarıyla imzalanır
# - v1.0.0 gibi bir etiket itilirse yalnızca imzalı APK Releases'a eklenir

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: İmza sırları var mı?
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 yok; APK debug anahtarıyla imzalanacak ve Releases'a eklenmeyecek."
          fi

      - name: Release anahtarını çöz
        if: steps.sign.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release
          echo "$KEYSTORE_BASE64" | base64 -d > release/tayf-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../../../release/tayf-release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > tayf_flutter/android/key.properties

      - name: APK derle
        working-directory: tayf_flutter
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64

      - name: Adını sürümle
        id: apk
        run: |
          src="tayf_flutter/build/app/outputs/flutter-apk/app-release.apk"
          out="tayf-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: tayf-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Etiketliyse Releases'a ekle
        if: startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
